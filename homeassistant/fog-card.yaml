# Карточка «Туманообразование» для Home Assistant
# Модули из HACS: Mushroom, mini-graph-card, Vertical Stack In Card, card-mod
# Дашборд → Изменить → Добавить карточку → «Вручную» → вставить всё ниже.
# Entity ID: HA строит их из зоны устройства и названия. Если устройство
# привязано к зоне (например, «Спальня»), префикс будет spalnia_tumanoobrazovanie_ —
# замените «tumanoobrazovanie_» поиском и заменой.

type: custom:vertical-stack-in-card
card_mod:
  style: |
    ha-card { border-radius: 20px; padding: 4px 0 8px; }
cards:
  # --- Шапка: состояние + главный выключатель (нажатие по иконке) ---
  - type: custom:mushroom-template-card
    entity: switch.tumanoobrazovanie_glavnyi_vykliuchatel_avtomatiki
    primary: Туман
    secondary: >-
      {% set s = states('sensor.tumanoobrazovanie_sostoianie') %}
      {% set rh = states('sensor.tumanoobrazovanie_vlazhnost_rh_dlia_gigrostata') %}
      {% set t = states('number.tumanoobrazovanie_tselevaia_vlazhnost') | int(0) %}
      {{ s }} · {{ rh | float(0) | round(0) | int if rh not in ['unknown','unavailable','nan'] else '—' }}% → {{ t }}%
    icon: >-
      {% set s = states('sensor.tumanoobrazovanie_sostoianie') %}
      {% if s == 'Авария' %}mdi:alert-octagon
      {% elif s == 'Ожидание воды' %}mdi:water-off
      {% elif s in ['Распыление','Пуск на дренаж'] %}mdi:weather-fog
      {% elif s == 'Промывка' %}mdi:water-sync
      {% elif s == 'Выключено' %}mdi:power
      {% else %}mdi:air-humidifier{% endif %}
    icon_color: >-
      {% set s = states('sensor.tumanoobrazovanie_sostoianie') %}
      {% if s == 'Авария' %}red
      {% elif s == 'Ожидание воды' %}amber
      {% elif s in ['Распыление','Пуск на дренаж','Промывка'] %}blue
      {% elif s == 'Выключено' %}disabled
      {% else %}teal{% endif %}
    layout: horizontal
    tap_action:
      action: more-info
    icon_tap_action:
      action: toggle
    card_mod:
      style: |
        ha-card { background: none; border: none; box-shadow: none; }
        {% if states('sensor.tumanoobrazovanie_sostoianie') in ['Распыление','Пуск на дренаж'] %}
        mushroom-shape-icon { animation: fog 2.4s ease-in-out infinite; }
        @keyframes fog { 50% { opacity: .55; } }
        {% endif %}

  # --- Чипы: влажность, насос, предупреждения ---
  - type: custom:mushroom-chips-card
    alignment: start
    card_mod:
      style: |
        ha-card { padding: 0 12px; }
    chips:
      - type: entity
        entity: sensor.tumanoobrazovanie_vlazhnost_rh_dlia_gigrostata
        icon: mdi:water-percent
        icon_color: blue
      - type: entity
        entity: sensor.tumanoobrazovanie_temperatura_nasosa
        icon: mdi:thermometer
        icon_color: >-
          {{ 'red' if states('sensor.tumanoobrazovanie_temperatura_nasosa') | float(0) > 60 else 'grey' }}
      - type: conditional
        conditions:
          - condition: numeric_state
            entity: sensor.tumanoobrazovanie_moshchnost_nasosa
            above: 0
        chip:
          type: entity
          entity: sensor.tumanoobrazovanie_moshchnost_nasosa
          icon: mdi:pump
          icon_color: blue
      - type: conditional
        conditions:
          - condition: state
            entity: sensor.tumanoobrazovanie_sostoianie
            state: Авария
        chip:
          type: template
          icon: mdi:alert
          icon_color: red
          content: "{{ states('sensor.tumanoobrazovanie_posledniaia_avariia').split(' · ')[0] }}"
          tap_action:
            action: call-service
            service: button.press
            target:
              entity_id: button.tumanoobrazovanie_sbros_avarii
            confirmation:
              text: Сбросить аварию? Сначала устраните причину.
      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.tumanoobrazovanie_trebuetsia_promyvka
            state: "on"
        chip:
          type: template
          icon: mdi:water-sync
          icon_color: amber
          content: Промывка
          tap_action:
            action: call-service
            service: button.press
            target:
              entity_id: button.tumanoobrazovanie_zapustit_promyvku
      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.tumanoobrazovanie_trebuetsia_to
            state: "on"
        chip:
          type: template
          icon: mdi:wrench-clock
          icon_color: amber
          content: ТО
      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.tumanoobrazovanie_trebuetsia_zamena_filtrov
            state: "on"
        chip:
          type: template
          icon: mdi:air-filter
          icon_color: amber
          content: Фильтры

  # --- График влажности за сутки ---
  - type: custom:mini-graph-card
    entities:
      - entity: sensor.tumanoobrazovanie_vlazhnost_rh_dlia_gigrostata
        name: Влажность
        color: "#3b82f6"
    hours_to_show: 24
    points_per_hour: 2
    line_width: 2
    height: 70
    lower_bound: 20
    upper_bound: 70
    smoothing: true
    show:
      name: false
      icon: false
      state: false
      legend: false
      labels: false
      points: false
      fill: fade
    card_mod:
      style: |
        ha-card { background: none; border: none; box-shadow: none; padding: 0 12px; }

  # --- Уставка влажности ползунком ---
  - type: custom:mushroom-number-card
    entity: number.tumanoobrazovanie_tselevaia_vlazhnost
    name: Целевая влажность
    icon: mdi:target
    icon_color: blue
    display_mode: slider
    card_mod:
      style: |
        ha-card { background: none; border: none; box-shadow: none; }
